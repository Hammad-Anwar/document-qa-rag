syntax = "proto3";

package documentqa.v1;

option java_multiple_files = true;
option java_package = "com.example.documentqa.proto";

service DocumentAIService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ProcessDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);
  rpc AskQuestion(QuestionRequest) returns (QuestionResponse);
}

message PingRequest {
  string name = 1;
}

message PingResponse {
  string message = 1;
}

message ProcessDocumentRequest {
  string document_id = 1;
  bytes file_content = 2;
  string filename = 3;
}
message ProcessDocumentResponse { int32 chunk_count = 1; }
message QuestionRequest {
  string document_id = 1;
  string question = 2;
}
message Source {
  int32 chunk_index = 1;
  optional int32 page = 2;
  string content = 3;
  double similarity = 4;
}
message QuestionResponse {
  string answer = 1;
  repeated Source sources = 2;
}
