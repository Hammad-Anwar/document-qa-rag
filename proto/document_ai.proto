syntax = "proto3";

package documentqa.v1;

option java_multiple_files = true;
option java_package = "com.example.documentqa.proto";

service DocumentAIService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string name = 1;
}

message PingResponse {
  string message = 1;
}
